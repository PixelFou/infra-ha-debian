vrrp_script check_haproxy {
    script "killall -0 haproxy"
    interval 2
    weight 2
}

# Groupe de synchronisation : force la bascule simultanée du LAN et de la DMZ
vrrp_sync_group VG_1 {
    group {
        VI_LAN
        VI_DMZ
    }
}

vrrp_instance VI_LAN {
    state MASTER
    interface enp0s8
    virtual_router_id 10      # VRID LAN imposé
    priority 101
    advert_int 1

    authentication {
        auth_type PASS
        auth_pass secret12
    }

    virtual_ipaddress {
        192.168.10.100/24
    }
track_script {
        check_haproxy
    }
}

vrrp_instance VI_DMZ {
    state MASTER
    interface enp0s9          # Remplace par ton interface HA-DMZ
    virtual_router_id 20      # VRID DMZ imposé
    priority 101
    advert_int 1

    authentication {
        auth_type PASS
        auth_pass secret12
    }

    virtual_ipaddress {
        192.168.20.100/24
    }

    track_script {
        check_haproxy
    }
}

