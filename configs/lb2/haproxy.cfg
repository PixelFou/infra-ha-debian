global
    log /dev/log local0
    log /dev/log local1 notice
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin
    stats timeout 30s
    user haproxy
    group haproxy
    daemon

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5000ms
    timeout client  50000ms
    timeout server  50000ms

# --- Page de statistiques (HA-SYNC : 10.99.99.11) ---
listen stats
    bind 10.99.99.12:8443 ssl crt /etc/haproxy/certs/portail.pem
    mode http
    stats enable
    stats uri /
    stats refresh 5s
    stats auth admin:PasswordHA2026!

# --- Frontend HTTP (Redirection 80 -> 443) ---
frontend http_front
    bind *:80
    http-request redirect scheme https code 301 if !{ ssl_fc }
# --- Frontend HTTPS (Terminaison TLS sur port 443) ---
frontend https_front
    bind *:443 ssl crt /etc/haproxy/certs/portail.pem
    mode http

    # Masquer la bannière du serveur web amont
    http-response del-header Server

    # En-têtes de sécurité
    http-response set-header Strict-Transport-Security "max-age=31536000; include>
    http-response set-header X-Content-Type-Options "nosniff"
    http-response set-header X-Frame-Options "DENY"

    default_backend web_servers

# --- Backend Web (WEB1 & WEB2) ---
backend web_servers
    mode http
    balance roundrobin
    cookie SERVERID insert indirect nocache

    acl is_write method POST
    use-server web1 if is_write

    option httpchk GET /health.php
    http-check expect status 200

    server web1 192.168.20.21:80 check inter 2000ms fall 5 rise 2 cookie web1
    server web2 192.168.20.22:80 check inter 2000ms fall 5 rise 2 cookie web2
