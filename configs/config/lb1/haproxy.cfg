global
    log /dev/log local0
    log /dev/log local1 notice
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin
    stats timeout 30s
    user haproxy
    group haproxy
    daemon

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5000ms
    timeout client  50000ms
    timeout server  50000ms

# --- Page de statistiques (HA-SYNC : 10.99.99.11) ---
listen stats
    bind 10.99.99.11:8080
    mode http
    stats enable
    stats uri /
    stats refresh 5s
    stats auth admin:PasswordHA2026!

# --- Frontend HTTP ---
frontend http_front
    bind 192.168.10.11:80
    default_backend web_servers

# --- Backend Web (WEB1 & WEB2) ---
backend web_servers
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    server web1 192.168.20.21:80 check inter 2000ms fall 2 rise 2
    server web2 192.168.20.22:80 check inter 2000ms fall 2 rise 2
